<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maintenance - Pesona Lintang Kemukus</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #cde4f5;
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
            padding: 20px;
        }

        .card {
            max-width: 700px;
            width: 100%;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: 32px;
            padding: 3rem 2.8rem;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 12px 35px rgba(30, 80, 150, 0.12);
            text-align: center;
        }

        h1 {
            font-size: 2.4rem;
            font-weight: 600;
            color: #03518b;
            letter-spacing: -0.2px;
            margin-bottom: 0.3rem;
        }

        .sub {
            font-size: 1.5rem;
            font-weight: 400;
            color: #1a6bb0;
            margin-bottom: 1.8rem;
            border-bottom: 2px solid rgba(60, 140, 220, 0.15);
            padding-bottom: 0.8rem;
            display: inline-block;
        }

        .message {
            background: rgba(255, 255, 255, 0.5);
            border-radius: 24px;
            padding: 1.6rem 2rem;
            margin: 1.2rem 0 2rem;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .message p {
            font-size: 1.15rem;
            line-height: 1.7;
            color: #025091;
            font-weight: 430;
        }

        .message .highlight {
            color: #0360a3;
            font-weight: 500;
        }

        .progress-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 1.2rem 0 1.8rem;
        }

        .progress-track {
            width: 100%;
            max-width: 340px;
            height: 8px;
            background: #d0e3f5;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        .progress-fill {
            width: 72%;
            height: 100%;
            background: #6baeff;
            border-radius: 20px;
        }

        .progress-label {
            margin-top: 8px;
            font-size: 0.85rem;
            color: #0460a3;
            background: rgba(255, 255, 255, 0.4);
            padding: 0.1rem 1.4rem;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            font-weight: 450;
        }

        .info-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.8rem 1.8rem;
            margin: 1rem 0 0.6rem;
        }

        .info-item {
            background: rgba(255, 255, 255, 0.5);
            border-radius: 40px;
            padding: 0.35rem 1.6rem;
            border: 1px solid rgba(255, 255, 255, 0.4);
            font-size: 0.95rem;
            color: #045594;
            font-weight: 450;
        }

        .footer-note {
            margin-top: 2.6rem;
            padding-top: 1.4rem;
            border-top: 1px solid rgba(255, 255, 255, 0.4);
            font-size: 0.85rem;
            color: #0b5f92;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 0.8rem 2rem;
            opacity: 0.75;
        }

        @media (max-width: 550px) {
            .card {
                padding: 2rem 1.5rem;
            }
            h1 {
                font-size: 1.9rem;
            }
            .sub {
                font-size: 1.2rem;
            }
            .message p {
                font-size: 1rem;
            }
            .info-item {
                font-size: 0.85rem;
                padding: 0.25rem 1.2rem;
            }
        }

        @media (max-width: 400px) {
            .card {
                padding: 1.6rem 1rem;
                border-radius: 24px;
            }
            h1 {
                font-size: 1.6rem;
            }
            .sub {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

<div class="card">

    <h1>Pemeliharaan</h1>
    <div class="sub">Pesona Lintang Kemukus</div>

    <div class="message">
        <p>
            Situs ini sedang dalam proses pemeliharaan.<br />
            <span class="highlight">Kami akan kembali dalam waktu dekat.</span>
        </p>
    </div>

    <div class="progress-wrap">
        <div class="progress-track">
            <div class="progress-fill"></div>
        </div>
        <div class="progress-label">Proses pemeliharaan berjalan</div>
    </div>

    <div class="info-grid">
        <span class="info-item">30 Juli 2026</span>
        <span class="info-item">09.00 – 15.00 WIB</span>
        <span class="info-item">Peningkatan sistem</span>
    </div>

    <div class="footer-note">
        <span>Tim Pesona Lintang Kemukus</span>
        <span>Terima kasih atas kesabaran Anda</span>
    </div>

</div>

</body>
</html>
